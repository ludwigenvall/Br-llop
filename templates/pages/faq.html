{% extends "base.html" %}
{% block title %}FAQ – {{ settings.site_title }}{% endblock %}

{% block content %}
<section class="page-header">
    <a href="/" class="back-link">← Tillbaka</a>
    <h1>Vanliga frågor</h1>
</section>

<section class="info-cards">
    {% for item in faq.questions %}
    <div class="info-card">
        <h2>{{ item.question }}</h2>
        <p>{{ item.answer }}</p>
    </div>
    {% endfor %}
</section>
{% endblock %}
